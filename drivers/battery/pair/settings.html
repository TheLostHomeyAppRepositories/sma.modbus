<script type="text/javascript">
    Homey.setTitle(__('pair.title'));
    $(function () {
        $('#connect').click(function () {
            $('.sma-error').hide();
            var inputaddress = $('#address').val().trim();
            if (inputaddress != '') {
                var settings = {
                    address: inputaddress
                };
                $('#connect').prop('disabled', true);
                $('.sma-error').show();
                $('.sma-error-msg').html(__('pair.connecting'));

                Homey.emit('settings', settings)
                    .then(function () {
                        // Success: the driver has already moved us to the device
                        // list view, so there is nothing to render here.
                    })
                    .catch(function (err) {
                        // Without this the rejection was swallowed and the view
                        // sat on 'connecting' forever with no explanation.
                        $('#connect').prop('disabled', false);
                        $('.sma-error').show();
                        $('.sma-error-msg').html((err && err.message) ? err.message : __('pair.failed'));
                    });
            } else {
                $('.sma-error').show();
                $('.sma-error-msg').html(__('pair.nosettings'));
            }
        });
    })
</script>

<style type="text/css">
    .form-group {
        width: 100%;
        display: block;
        margin-bottom: 12px;
    }

    .form-group label {
        display: block;
    }

    .sma-status,
    .sma-info {
        display: none;
    }

    .sma-info {
        margin-top: 10px;
        font-size: 12px;
    }

    .sma-info .info-label {
        min-width: 150px;
        font-weight: 700;
    }

    .buttons,
    .messages {
        padding-top: 14px;
    }

    .button:disabled {
        color: #ccc;
    }

    .button:enabled {
        background-color: #00c139 !important;
        color: #fff;
    }
</style>

<p data-i18n="pair.intro">Enter the IP address of your SMA device</p>
<div class="sma-pairing">
    <div class="form-group">
        <label for="address" data-i18n="pair.address">IP address</label>
        <input type="text" class="form-control" id="address" placeholder="192.168.1.2" required>
    </div>
    <div class="form-group buttons">
        <button id="connect" class="button" data-i18n="pair.connect">Connect</button>
    </div>
</div>

<div class="messages">
    <p class="sma-status sma-error" style="color: #ff6300;">
        <i class="fa fa-times"></i> 
        <span class="sma-error-msg"></span>
    </p>
</div>
